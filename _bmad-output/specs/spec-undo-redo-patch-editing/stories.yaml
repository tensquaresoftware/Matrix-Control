  invoke_dev_with: >-
    Wire ModulationBusCell reorder completion as one transaction. Implement
    Cmd/Ctrl+Z and Shift variant at PluginEditor; skip text fields and dialogs.
    Update manuel-utilisateur.md §7.

- id: "12-5"
  title: Mutator load policy dirty tracker and Core tests
  description: >-
